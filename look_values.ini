; 리세이드에 켜 주는 기본 효과의 값.
; 프리셋이 비어 있는 게임에만 들어갑니다. 쓰시던 프리셋은 건드리지 않습니다.
; 여기 숫자만 고치면 됩니다. 프로그램을 다시 만들 필요가 없습니다.
;
; 2026-10-24 라오어 1에서 켜 보며 맞춘 값입니다.
; 처음에는 데이즈곤 값(curve_height 0.70, grainamount 0.05)을 썼는데
; 있는지 없는지 모를 만큼 약했습니다.

[AdaptiveSharpen.fx]
; 선명도. 셰이더 기본값은 1.0, 범위는 0.01~2.0 입니다.
curve_height=1.200000
; 아래 overshoot 둘이 테두리가 하얗게 뜨는 것을 막습니다. 건드리지 마십시오.
L_overshoot=0.003000
D_overshoot=0.009000
curveslope=0.500000
D_compr_high=0.500000
D_compr_low=0.250000
L_compr_high=0.334000
L_compr_low=0.167000
pm_p=0.700000
scale_cs=0.056000
scale_lim=0.100000

[FilmGrain2.fx]
; 그레인 양. 범위 0~0.2 의 절반입니다. 기본값 0.05 는 사실상 최소입니다.
grainamount=0.100000
; 색 노이즈. 기본 0.6 에서 내렸습니다. 실제 센서 노이즈는 거의 휘도 쪽입니다.
coloramount=0.250000
lumamount=1.000000
; 알갱이 크기. 픽셀 단위라 해상도가 낮을수록 굵게 보입니다.
; 데이즈곤은 2.00 인데 그건 4K 영상 압축에서 살아남게 고른 값입니다.
grainsize=1.600000
